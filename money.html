:root{
  --bg:#eef2f7; --surface:#ffffff; --surface2:#f4f7fb; --line:#dbe3ee; --fg:#0f1b2d; --muted:#5b6b82;
  --accent:#0b8f86; --accent-ink:#ffffff; --good:#12805c; --bad:#c2410c; --warn:#a16207;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.06);

  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Unbounded','Onest',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#2dd4bf; --accent-ink:#04201c; --good:#4ade80; --bad:#fb923c; --warn:#fbbf24; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:1120px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 8px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.logo{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px}
.month button{border:0;background:transparent;width:32px;height:30px;border-radius:8px;font-size:16px;color:var(--muted)}
.month button:hover{background:var(--surface2)}
.month b{min-width:128px;text-align:center;font-weight:600;font-size:14px}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:10px 14px;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* generic */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:clamp(18px,2.6vw,26px);font-weight:500;letter-spacing:-.02em;margin:6px 0 4px;overflow-wrap:anywhere}
.kpi .v small{font-size:.5em;color:var(--muted);font-family:var(--font)}
.kpi .l{color:var(--muted);font-size:13px}
.delta{font-size:12px;font-weight:600;display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:99px;background:var(--surface2)}
.delta.up-good,.delta.dn-good{color:var(--good)} .delta.up-bad,.delta.dn-bad{color:var(--bad)} .delta.flat{color:var(--muted)}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* sankey */
#sankey{width:100%;min-height:260px}
#sankey svg{display:block;width:100%;height:auto}
#sankey text{fill:var(--fg);font-family:var(--font)}
#sankey .t2{fill:var(--muted);font-family:var(--mono)}
#sankey path.lk{fill-opacity:.28;transition:fill-opacity .15s}
#sankey path.lk:hover{fill-opacity:.55}

/* donut + lists */
.legend{display:grid;gap:8px;margin-top:12px}
.lg{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.lg .sw{width:12px;height:12px;border-radius:3px}
.lg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .vv{font-family:var(--mono);font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.over>i{background:var(--bad)}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 6px;border-radius:10px;align-items:center;border:0;background:transparent;text-align:left;width:100%}
button.item:hover{background:var(--surface2)}
.item .a{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .b{color:var(--muted);font-size:12.5px;grid-column:1}
.item .r{font-family:var(--mono);text-align:right;grid-row:1/3;grid-column:2;font-size:14px}
.pos{color:var(--good)} .neg{color:var(--fg)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.ok{color:var(--good)} .pill.late{color:var(--bad)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dng{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 14px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;
  border:0;background:var(--accent);color:var(--accent-ink);height:54px;padding:0 22px;border-radius:99px;font-weight:700;font-size:16px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px}
.fab span{font-size:22px;line-height:1}

/* modal */
.ov{position:fixed;inset:0;background:rgba(3,8,18,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.modal{background:var(--surface);border:1px solid var(--line);width:100%;max-width:460px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media(min-width:640px){.modal{border-radius:18px}}
.modal h3{margin:0 0 12px;font-family:var(--display);font-size:16px;font-weight:500}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.amt{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
td.n,th.n{text-align:right;font-family:var(--mono)}
.scroll{overflow-x:auto}
.empty{color:var(--muted);padding:22px 8px;text-align:center}
.goal{display:grid;gap:8px}
.goal .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.goal h4{margin:0;font-size:16px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;max-width:240px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:70;font-size:14px}
.note{font-size:13px;color:var(--muted)}
.sect{display:grid;gap:14px}
.who{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:5px 12px;font-size:13px}
.chip b{font-family:var(--mono);font-weight:500;margin-left:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function ensureRec(){

  S.rec.forEach(function(r){

    if(S.exp.some(function(e){return e.recId===r.id&&e.date.slice(0,7)===m}))return;
    var dd=Math.min(r.day,28);S.exp.push({id:uid(),date:m+'-'+String(dd).padStart(2,'0'),amt:r.amt,cur:r.cur,cat:r.cat,who:r.who,note:r.name,recId:r.id,paid:false});ch=true});
  if(ch)save()}
function monthData(m){
  var inc=S.inc.filter(function(x){return x.date.slice(0,7)===m}),exp=S.exp.filter(function(x){return x.date.slice(0,7)===m}),con=S.con.filter(function(x){return x.date.slice(0,7)===m});
  var sum=function(a){return a.reduce(function(s,x){return s+toUZS(x.amt,x.cur)},0)};
  var I=sum(inc),X=sum(exp),C=sum(con);
  var byCat={},byWho={},bySrc={};
  exp.forEach(function(x){var v=toUZS(x.amt,x.cur);byCat[x.cat]=(byCat[x.cat]||0)+v;byWho[x.who]=(byWho[x.who]||0)+v});
  inc.forEach(function(x){bySrc[x.src||t('inc')]=(bySrc[x.src||t('inc')]||0)+toUZS(x.amt,x.cur)});
  return {inc:inc,exp:exp,con:con,I:I,X:X,C:C,left:I-X-C,byCat:byCat,byWho:byWho,bySrc:bySrc}}

function donutSvg(parts,total){
  var R=70,r=46,cx=90,cy=90,a0=-Math.PI/2,out='';
  parts.forEach(function(p){var frac=p.v/total,a1=a0+frac*Math.PI*2;if(frac>=.9999)a1=a0+Math.PI*2-.0001;
    var lg=a1-a0>Math.PI?1:0,x=function(rr,a){return (cx+rr*Math.cos(a)).toFixed(2)},y=function(rr,a){return (cy+rr*Math.sin(a)).toFixed(2)};
    out+='<path d="M'+x(R,a0)+' '+y(R,a0)+'A'+R+' '+R+' 0 '+lg+' 1 '+x(R,a1)+' '+y(R,a1)+'L'+x(r,a1)+' '+y(r,a1)+'A'+r+' '+r+' 0 '+lg+' 0 '+x(r,a0)+' '+y(r,a0)+'Z" fill="'+CCOL[p.c]+'" stroke="var(--surface)" stroke-width="2" data-tip="'+esc(catName(p.c))+': '+fmt(p.v)+'"/>';a0=a1});
  return '<svg viewBox="0 0 180 180" style="width:100%;max-width:230px;display:block;margin:0 auto" role="img" aria-label="'+t('donut')+'">'+out+
    '<text x="90" y="86" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--font)">'+t('expenses')+'</text><text x="90" y="102" text-anchor="middle" font-size="13" fill="var(--fg)" font-family="var(--mono)">'+fmtS(total)+'</text></svg>'}

/* sankey */
function drawSankey(){
  var box=$('#sankey');if(!box)return;var m=monthData(ui.month),W=box.clientWidth||600;
  var L=[],R=[];
  Object.keys(m.bySrc).forEach(function(k,i){L.push({n:k,v:m.bySrc[k],c:['var(--c2)','var(--c1)','var(--c8)','var(--c6)'][i%4]})});
  var gap=m.X+m.C-m.I;if(gap>0)L.push({n:t('deficit'),v:gap,c:'var(--c7)'});
  Object.keys(m.byCat).sort(function(a,b){return m.byCat[b]-m.byCat[a]}).forEach(function(c){R.push({n:catName(c),v:m.byCat[c],c:CCOL[c]})});
  if(m.C>0)R.push({n:t('savingsNode'),v:m.C,c:'var(--accent)'});
  if(m.left>0)R.push({n:t('remain'),v:m.left,c:'var(--c9)'});
  var total=Math.max(L.reduce(function(s,x){return s+x.v},0),1);
  if(!L.length||!R.length){box.innerHTML='<div class="empty">'+t('noData')+'</div>';return}
  var mob=W<560,mx=mob?84:150,H=Math.max(300,R.length*38+20),pad=8,bw=10;
  var avail=H-pad*2-Math.max(L.length,R.length)*8;
  var sc=avail/total;
  var place=function(a,mh){var y=pad;a.forEach(function(n){n.h=Math.max(n.v*sc,mh);n.y=y;y+=n.h+8;n.o=0;n.oi=0});};
  place(L,14);place(R,28);
  var lh=L.reduce(function(s,n){return s+n.h},0),rh=R.reduce(function(s,n){return s+n.h},0);
  var Hn=Math.max(lh,rh)+pad*2+Math.max(L.length,R.length)*8;
  var x0=mx,x1=W-mx-bw,svg='<svg viewBox="0 0 '+W+' '+Hn+'" width="'+W+'" height="'+Hn+'" role="img" aria-label="'+t('chartTitle')+'">',links='';
  // links: each left node distributes proportionally across right nodes (scaled to node heights)
  R.forEach(function(r){r.fill=0});
  L.forEach(function(l){var lo=0;
    R.forEach(function(r){var share=l.v/total,hl=l.h*(r.v/total)/(l.v/total)*(l.v/total)/ (r.v/total);
      var thick=Math.min(l.h,r.h)*0; // placeholder
      var w=(r.h*(l.v/total)/(1)); // height at right side
      var hR=r.h*(l.v/ L.reduce(function(s,n){return s+n.v},0));
      var hL=l.h*(r.v/ R.reduce(function(s,n){return s+n.v},0));
      var ly=l.y+l.o,ry=r.y+r.fill;l.o+=hL;r.fill+=hR;
      var xm=(x0+bw+x1)/2;
      links+='<path class="lk" d="M'+(x0+bw)+' '+ly.toFixed(1)+'C'+xm+' '+ly.toFixed(1)+' '+xm+' '+ry.toFixed(1)+' '+x1+' '+ry.toFixed(1)+'L'+x1+' '+(ry+hR).toFixed(1)+'C'+xm+' '+(ry+hR).toFixed(1)+' '+xm+' '+(ly+hL).toFixed(1)+' '+(x0+bw)+' '+(ly+hL).toFixed(1)+'Z" fill="'+r.c+'" data-tip="'+esc(l.n)+' → '+esc(r.n)+': '+fmt(l.v*r.v/ Math.max(L.reduce(function(s,n){return s+n.v},0),1))+'"/>'})});
  svg+=links;
  var fs=mob?11:13;
  L.forEach(function(n){svg+='<rect x="'+x0+'" y="'+n.y+'" width="'+bw+'" height="'+n.h+'" rx="3" fill="'+n.c+'"/>'+
    '<text x="'+(x0-8)+'" y="'+(n.y+n.h/2-(n.h>26?1:-4))+'" text-anchor="end" font-size="'+fs+'" font-weight="600">'+esc(cut(n.n,mob?11:20))+'</text>'+(n.h>26?'<text class="t2" x="'+(x0-8)+'" y="'+(n.y+n.h/2+13)+'" text-anchor="end" font-size="'+(fs-1)+'">'+fmtS(n.v)+'</text>':'')});
  R.forEach(function(n){var cy=n.y+n.h/2;svg+='<rect x="'+x1+'" y="'+n.y+'" width="'+bw+'" height="'+n.h+'" rx="3" fill="'+n.c+'"/>'+
    '<text x="'+(x1+bw+8)+'" y="'+(cy-1)+'" font-size="'+fs+'" font-weight="600">'+esc(cut(n.n,mob?11:22))+'</text><text class="t2" x="'+(x1+bw+8)+'" y="'+(cy+13)+'" font-size="'+(fs-1)+'">'+fmtS(n.v)+' · '+Math.round(n.v/total*100)+'%</text>'});
  box.innerHTML=svg+'</svg>'}

function monthsLeft(dl){if(!dl)return 0;var a=ym(new Date()).split('-'),b=dl.split('-');return Math.max(1,(+b[0]-+a[0])*12+(+b[1]-+a[1]))}

function vCmp(v){

  var ks=Object.keys(keys).sort(function(a,b){return (c.byCat[b]||0)-(c.byCat[a]||0)});
  var mx=Math.max.apply(null,ks.map(function(k){return Math.max(c.byCat[k]||0,p.byCat[k]||0)}).concat([1]));
  var row=function(name,a,b,col,bold){var d=a-b,pc=b?Math.round(d/b*100):null;

  var bars=ks.map(function(k){return '<div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;font-size:13px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(catName(k))+'</span><div><div class="bar" style="margin-bottom:3px"><i style="width:'+((c.byCat[k]||0)/mx*100)+'%;background:'+CCOL[k]+'"></i></div><div class="bar"><i style="width:'+((p.byCat[k]||0)/mx*100)+'%;background:var(--muted);opacity:.55"></i></div></div></div>'}).join('');
  v.innerHTML='<div class="sect"><div class="card"><h2>'+t('cmp')+': '+monthLabel(prevM(ui.month))+' → '+monthLabel(ui.month)+'</h2><div class="scroll"><table><thead><tr><th></th><th class="n">'+t('prev')+'</th><th class="n">'+t('curr')+'</th><th class="n">'+t('diff')+'</th></tr></thead><tbody>'+
    row(t('income'),c.I,p.I,null,true)+row(t('expenses'),c.X,p.X,null,true)+row(t('saving'),c.C,p.C,null,true)+row(t('left'),c.left,p.left,null,true)+
    ks.map(function(k){return row(catName(k),c.byCat[k]||0,p.byCat[k]||0,CCOL[k])}).join('')+'</tbody></table></div></div>'+
    '<div class="card"><h2>'+t('expenses')+' · '+monthLabel(ui.month)+' / <span style="opacity:.7">'+monthLabel(prevM(ui.month))+'</span></h2><div class="grid" style="gap:12px">'+(bars||'<div class="empty">'+t('noData')+'</div>')+'</div></div></div>'}

/* ---------- export / backup ---------- */
function rowsFor(all){
  var h=[t('date'),t('type'),t('cat')+' / '+t('source')+' / '+t('goal'),t('forWho'),t('note'),t('amount'),'Валюта','UZS'];
  var tn={inc:t('inc'),exp:t('expense'),con:t('saving')};
  var rows=allOps().filter(function(o){return all||o.d.slice(0,7)===ui.month}).reverse().map(function(o){var x=o.x;
    return [x.date,tn[o.k],o.k==='exp'?catName(x.cat):o.k==='inc'?(x.src||''):o.t,o.k==='exp'?whoName(x.who):'',x.note||'',x.amt,x.cur,Math.round(toUZS(x.amt,x.cur))]});
  return [h].concat(rows)}
function csvStr(rows){return '﻿'+rows.map(function(r){return r.map(function(c){c=String(c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\r\n')}
function doSave(name,data){
  claude_use('downloads').then(function(d){if(!d){toast(t('exFail'));return}
    return d.save({filename:name,data:data}).then(function(){toast(t('exSaved'))},function(e){if(e&&e.code!=='declined')toast(t('exFail'))})})}
function claude_use(n){try{return window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)}catch(e){return Promise.resolve(null)}}
function doExport(kind){
  var all=kind.slice(-1)==='A',rows=rowsFor(all),tag=all?'all':ui.month;
  if(kind.indexOf('csv')===0)return doSave('budget-'+tag+'.csv',csvStr(rows));
  if(!window.XLSX){toast(t('exFail'));return}
  var wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:11},{wch:12},{wch:24},{wch:12},{wch:24},{wch:14},{wch:8},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws,'Операции');
  var m=monthData(ui.month),sm=[[t('income'),Math.round(m.I)],[t('expenses'),Math.round(m.X)],[t('saving'),Math.round(m.C)],[t('left'),Math.round(m.left)],[],[t('cat'),'UZS']];
  Object.keys(m.byCat).forEach(function(c){sm.push([catName(c),Math.round(m.byCat[c])])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sm),monthLabel(ui.month).slice(0,31));
  var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});doSave('budget-'+tag+'.xlsx',new Uint8Array(out))}

/* ---------- rate ---------- */
function fetchRate(manual){
  var done=false,ctrl=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){if(ctrl)ctrl.abort()},6000);
  var tries=[function(){return fetch('https://cbu.uz/ru/arkhiv-kursov-valyut/json/USD/',{signal:ctrl&&ctrl.signal}).then(function(r){return r.json()}).then(function(j){return {rate:parseFloat(j[0].Rate),date:j[0].Date.split('.').reverse().join('-')}})},
             function(){return fetch('https://open.er-api.com/v6/latest/USD',{signal:ctrl&&ctrl.signal}).then(function(r){return r.json()}).then(function(j){return {rate:j.rates.UZS,date:today()}})}];
  (function next(i){if(i>=tries.length){clearTimeout(to);if(manual)toast(t('rateAutoFail'));return}
    try{tries[i]().then(function(r){if(!(r.rate>100))throw 0;clearTimeout(to);S.set.rate=Math.round(r.rate*100)/100;S.set.rateDate=r.date;save();render();if(manual)toast(t('rateOk'))},function(){next(i+1)})}catch(e){next(i+1)}})(0)}

  if(el.dataset.topup){openForm('con',null,el.dataset.topup);var s=$('#kseg');return}
  if(el.dataset.ex){doExport(el.dataset.ex);return}
  if(el.id==='rateBtn'){fetchRate(true);return}
  if(el.id==='wadd'){var n=$('#wnew').value.trim();if(n&&S.who.indexOf(n)<0){S.who.push(n);save();render()}return}
  if(el.dataset.wdel){S.who.splice(+el.dataset.wdel,1);save();render();return}
  if(el.id==='clrDemo'){var k=S.set,b=blank();b.set=k;b.set.demo=false;b.who=S.who;S=b;save();render();return}
  if(el.id==='bk'){doSave('budget-backup.json',JSON.stringify(S,null,1));return}
});
document.addEventListener('change',function(e){var el=e.target;
  if(el.id==='ft'||el.id==='fc'||el.id==='fw'){ui.f[{ft:'type',fc:'cat',fw:'who'}[el.id]]=el.value;render();return}
  if(el.dataset.paid){var x=S.exp.filter(function(q){return q.id===el.dataset.paid})[0];if(x){x.paid=el.checked;save();render()}return}
  if(el.id==='rate'){var r=parseFloat(el.value.replace(',','.'));if(r>100){S.set.rate=r;S.set.rateDate=today();save();render()}return}
  if(el.id==='auto'){S.set.auto=el.checked;save();return}
  if(el.dataset.lim){var v=parseFloat(el.value.replace(/\s/g,''));S.limits=S.limits||{};if(v>0)S.limits[el.dataset.lim]=v;else delete S.limits[el.dataset.lim];save();return}
  if(el.id==='rs'){var f=el.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var j=JSON.parse(rd.result);if(!j.set||!j.exp||!j.inc)throw 0;S=j;save();toast(t('restored'));render()}catch(x){toast(t('badFile'))}};rd.readAsText(f);return}
});
document.addEventListener('input',function(e){if(e.target.id==='fq'){ui.f.q=e.target.value;var pos=e.target.selectionStart;vOps($('#view'));var q=$('#fq');q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeForm()});
var tip=null;
document.addEventListener('pointermove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');
  if(!el){if(tip){tip.remove();tip=null}return}
  if(!tip){tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip)}
  tip.textContent=el.getAttribute('data-tip');tip.style.left=Math.min(e.clientX+12,innerWidth-250)+'px';tip.style.top=(e.clientY+14)+'px'});
document.addEventListener('pointerleave',function(){if(tip){tip.remove();tip=null}});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(ui.tab==='overview')drawSankey()},120)});
var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');if(mq&&mq.addEventListener)mq.addEventListener('change',applyTheme);

/* ---------- boot ---------- */
load();
S.limits=S.limits||{};
render();
if(S.set.auto)fetchRate(false);
})();
</script>

</body></html>
